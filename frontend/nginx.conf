server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 预测首次调用可能需要加载模型，放宽超时
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        try_files $uri /index.html;
    }
}
